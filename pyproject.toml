[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "lu77U-MobileSec"
version = "0.1.5"
description = "Android APK security analysis in a local web dashboard: decompilers, deterministic scanners and AI agents, graded findings with exploit chains, and optional verification on a device"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    {name = "Sam MG Harish", email = "sammgharish@gmail.com"},
]
maintainers = [
    {name = "Sam MG Harish", email = "sammgharish@gmail.com"},
]
keywords = [
    "android", "apk", "mobile-security", "application-security", "static-analysis",
    "dynamic-analysis", "sast", "vulnerability-scanner", "penetration-testing", "llm",
    "ai-agents", "frida", "flutter", "react-native", "owasp-masvs",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Natural Language :: English",
]
dependencies = [
    "colorama>=0.4.6",
    "androguard>=4.1.3",
    "loguru>=0.7.3",
    "weasyprint>=66.0; sys_platform != 'win32'",
    "Pillow>=11.3.0; sys_platform != 'win32'",
    "ollama>=0.6.0",
    "keyring>=24.0.0",
    "platformdirs>=4.0.0",
    "cryptography>=42.0.0",
    "httpx>=0.27.0",
    "fastapi>=0.110.0,<1.0",
    "uvicorn[standard]>=0.29.0",
    "python-multipart>=0.0.9",
    "websockets>=12.0",
    "frida==16.7.19",
    "frida-tools>=13,<14",
    "uiautomator2>=3.0.0",
    "defusedxml>=0.7.1",
    "Pygments>=2.17.0",
    "json_repair>=0.30",
]

[project.optional-dependencies]
claude = ["anthropic>=0.40.0"]
semgrep = ["semgrep>=1.100.0"]
mitmproxy = ["mitmproxy>=10.0.0"]
dev = ["pytest>=8.0"]
all = ["anthropic>=0.40.0", "pytest>=8.0", "semgrep>=1.100.0", "mitmproxy>=10.0.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    "ignore:.*httpx2.*",
]

[project.urls]
Homepage = "https://github.com/sam-mg/lu77U-MobileSec"
Documentation = "https://github.com/sam-mg/lu77U-MobileSec/wiki"
Repository = "https://github.com/sam-mg/lu77U-MobileSec"
Issues = "https://github.com/sam-mg/lu77U-MobileSec/issues"
Demo = "https://sam-mg.github.io/lu77U-MobileSec/"
Funding = "https://github.com/sponsors/sam-mg"

[project.scripts]
"lu77U-MobileSec" = "lu77U_MobileSec.cli.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["lu77U_MobileSec*"]

[tool.setuptools.package-data]
"lu77U_MobileSec" = ["skills/*.md", "rules/semgrep/*/*.yml", "rules/semgrep/*/*.yaml", "decompiler/ghidra_scripts/*.java"]
"lu77U_MobileSec.web" = ["static/**/*", "static/*"]