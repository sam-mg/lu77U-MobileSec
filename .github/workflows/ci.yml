name: CI

# Runs the same two gates as the pre-push hook. The hook can be bypassed with
# --no-verify; this cannot, so it is the gate that actually holds.

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  checks:
    name: comment style + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Comment style
        run: python scripts/check_comment_style.py

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Tests
        run: python -m pytest -q
