name: CI

# Runs the same four gates as the pre-push hook, via the identical scripts. The hook can be bypassed with --no-verify; this cannot, so it is the gate that actually holds.

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

permissions:
  contents: read

jobs:
  checks:
    name: comment style + tests + codeql + clean install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Comment style
        run: python scripts/check_comment_style.py

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Tests
        run: python -m pytest -q

      - name: Cache CodeQL CLI and query packs
        uses: actions/cache@v4
        with:
          path: |
            ~/.codeql-lu77u
            ~/.codeql/packages
          key: codeql-${{ runner.os }}-${{ hashFiles('scripts/codeql_scan.sh') }}
          restore-keys: |
            codeql-${{ runner.os }}-

      - name: CodeQL
        run: ./scripts/codeql_scan.sh

      - name: Clean install
        run: ./scripts/verify_install.sh
