name: Deploy UI demo to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "lu77U_MobileSec/frontend/**"
      - "pyproject.toml"
      - ".github/workflows/demo-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: lu77U_MobileSec/frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: lu77U_MobileSec/frontend
        run: npm ci

      - name: Build static demo
        working-directory: lu77U_MobileSec/frontend
        run: npm run build:demo

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: demo-dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
